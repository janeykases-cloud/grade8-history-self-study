function nav(){ $('#nav').innerHTML=lessons.map((l,i)=>'<button class="nav-unit" data-page="'+i+'"><span>'+l.icon+'</span><span><small>0'+(i+1)+'</small>'+esc(l.title)+'</span><b class="tick" aria-label="已完成">✓</b></button>').join('')+'<button class="final-nav" data-page="8">🏁 總結挑戰與成績</button>';$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)go(+b.dataset.page);};}

let i=state.page,l=lessons[i];let count=l.groups.reduce((n,g)=>n+g.nodes.length,0),shown=Number(state.reveals[i])||1;
let off=0;let diagrams=l.groups.map(g=>'<article class="flow-group"><h3>'+esc(g.name)+'</h3><ol class="flow">'+g.nodes.map((n,j)=>{let p=off++;return '<li class="'+(p<shown?'':'hidden-node')+'">'+(j?'<span class="relation">'+esc(g.links[j-1]||'影響')+' ↓</span>':'')+'<div class="node '+(j===0?'cause':j===g.nodes.length-1?'effect':'action')+'"><span class="type">'+(i===0?'時間定位':j===0?'背景／條件':j===g.nodes.length-1?'結果／後續':'行動／過程')+'</span>'+esc(n)+'</div></li>';}).join('')+'</ol></article>').join('');
$('#main').innerHTML='<div class="eyebrow">LEARNING JOURNEY / 0'+(i+1)+'<span>'+esc(l.era)+'</span></div><h1>'+l.icon+' '+esc(l.title)+'</h1><p class="lead">'+esc(l.intro)+'</p><div class="route"><span class="active">① 讀圖</span><span>② 排關係</span><span>③ 檢查理解</span></div>'+(i===0?timeline():'')+'<section class="panel"><div class="section-top"><div><small class="kicker">STEP 01 · 看見關係</small><h2>一格一格，讀懂中間怎麼發生</h2></div><div class="tools"><button id="reveal">下一格</button><button class="quiet" id="showall">全部展開</button></div></div><p class="muted">橘：背景／條件　紫：行動／過程　綠：結果／後續。箭頭上的文字解釋關係；「之後」只表示先後。</p><div class="diagram-grid">'+diagrams+'</div><p class="concept"><b>💡 我看懂了</b>'+esc(l.concept)+'</p></section><section class="panel"><small class="kicker">STEP 02 · 自己連起來</small><h2>'+esc(l.orderLabel||'點選卡片，排出合理關係')+'</h2><p class="muted">依序點選三張卡片。不需要拖曳；點錯可重排。</p><div id="sort"></div><div class="tools"><button id="checkorder">檢查順序</button><button class="quiet" id="resetorder">重新排列</button></div><p id="orderfeedback" class="feedback" role="status" aria-live="polite">'+(state.orders[i]?'✓ 你已完成這一組關係。可再排一次複習。':'先找起點，再找中間過程與結果。')+'</p></section><section class="panel"><small class="kicker">STEP 03 · 檢查理解</small><h2>不只記名詞，也能解釋關係</h2>'+l.qs.map((q,j)=>qblock(q,i+'-'+j,state.answers)).join('')+'</section><section class="note-box"><label for="note">✎ 用自己的話說：因為……透過……所以……</label><textarea id="note" rows="3" placeholder="試著補上中間的關係，也可以寫下仍不明白的地方。">'+esc(state.notes[i]||'')+'</textarea><p class="muted">這段反思不自動評分。</p></section><div class="bottom-nav"><button class="quiet" id="prev" '+(i===0?'disabled':'')+'>← 上一單元</button><span id="unitStatus"></span><button id="next">'+(i===7?'前往總結挑戰':'下一單元 →')+'</button></div>';
$('#reveal').disabled=shown>=count;$('#reveal').onclick=()=>{state.reveals[i]=Math.min(shown+1,count);save();render();};
$('#showall').onclick=()=>{state.reveals[i]=count;save();render();};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#note').oninput=e=>{state.notes[i]=e.target.value;save();};
$('#checkorder').onclick=checkOrder;$('#resetorder').onclick=()=>{sequence=[];renderSort();$('#orderfeedback').textContent='已清空，重新選擇起點。';};
renderSort();bindPractice();if(i===0)bindTimeline();updateProgress();unitStatus();
}
function unitStatus(){let el=$('#unitStatus');if(el)el.textContent=completed(state.page)?'✓ 本單元完成':'完成排序與兩題訂正，即可點亮單元';}
function renderSort(){let l=lessons[state.page],indices=[2,0,1];$('#sort').innerHTML='<div class="sort-cards">'+indices.map(j=>'<button class="sort-card '+(sequence.includes(j)?'selected':'')+'" data-sort="'+j+'" '+(sequence.includes(j)?'disabled':'')+'><b>'+(sequence.includes(j)?sequence.indexOf(j)+1:'＋')+'</b>'+esc(l.order[j])+'</button>').join('')+'</div><div class="sort-result">'+(sequence.length?sequence.map(j=>esc(l.order[j])).join('　→　'):'你的順序會出現在這裡')+'</div>';$('#sort').onclick=e=>{let b=e.target.closest('[data-sort]');if(b&&!sequence.includes(+b.dataset.sort)){sequence.push(+b.dataset.sort);renderSort();}};}
function checkOrder(){let i=state.page;if(sequence.length!==3){$('#orderfeedback').textContent='請先選完三張卡片。';return;}let ok=sequence.every((v,j)=>v===j);if(ok){state.orders[i]=true;save();unitStatus();}$('#orderfeedback').textContent=ok?'✓ 關係合理！現在試著把箭頭說成完整句子。':'↻ 還需要調整。先找最早的背景或條件，再找中間過程，最後找結果。請按「重新排列」再試一次。';}
function bindPractice(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let id=b.dataset.answer,j=+id.split('-')[1],q=lessons[state.page].qs[j],pick=+b.dataset.choice,old=state.answers[id];if(old?.correct)return;let hint='回到思考圖，找出中間過程；注意是否把「部分」說成「全部」，或把「先後」當成「因果」。';state.answers[id]={pick,correct:pick===q[2],first:old?old.first:pick===q[2],hint};let pos=window.scrollY;save();render();window.scrollTo(0,pos);});}
const years=[960,1005,1115,1127,1206,1219,1271,1279,1368,1405,1582,1636,1644];
const events={960:'北宋建立，與遼並存。',1005:'宋遼訂立澶淵之盟。',1115:'金建立；北宋與遼仍在。',1127:'靖康之禍；北宋滅亡、南宋建立。',1206:'蒙古國建立；南宋與金仍在。',1219:'蒙古首次西征。',1271:'元朝建立；南宋仍存在。',1279:'元滅南宋。',1368:'明建立；元廷退往北方。',1405:'鄭和首次下西洋。',1582:'利瑪竇抵華。',1636:'大清國號確立；明仍在。',1644:'李自成攻陷北京，明中央政權覆亡；之後清兵入關。'};
const dynasties=[['遼',947,1125],['北宋',960,1127],['金',1115,1234],['南宋',1127,1279],['蒙古國',1206,1271],['元',1271,1368],['明',1368,1644],['清',1636,1912]];
function timeline(){return '<section class="timeline-panel"><small class="kicker">TIME EXPLORER · 年代觀察站</small><h2>選一年，看誰和誰同時存在</h2><div class="year-buttons">'+years.map(y=>'<button class="year '+(y===timelineYear?'active':'')+'" data-year="'+y+'">'+y+'</button>').join('')+'</div><div id="time-result" role="status" aria-live="polite"></div><p class="muted">這是事件定位，按鈕距離不代表相隔年數。轉折年以該事件完成後的主要政權呈現；同一年內仍可能有先後變化。</p></section>';}
function timeResult(){let active=dynasties.filter(d=>timelineYear>=d[1]&&timelineYear<d[2]);$('#time-result').innerHTML='<div class="year-number">'+timelineYear+'<small>西元年</small></div><div><b>'+esc(events[timelineYear])+'</b><div class="dynasties">'+active.map(d=>'<span>'+d[0]+'</span>').join('')+'</div><p>此處只列本課主要政權，並非當時所有國家。蒙古國與元分欄是國號轉折，不代表所有蒙古汗國同時消失；元朝1368年後仍有北方政權延續。</p></div>';document.querySelectorAll('[data-year]').forEach(b=>{b.classList.toggle('active',+b.dataset.year===timelineYear);b.setAttribute('aria-pressed',String(+b.dataset.year===timelineYear));});}
function bindTimeline(){document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{timelineYear=+b.dataset.year;timeResult();});timeResult();}
function renderFinal(){let submitted=Object.keys(state.final).length===finals.length,correct=Object.entries(state.final).filter(([id,a])=>a.correct).length,score=Math.round(correct/finals.length*100);let mistakes=finals.map((q,j)=>state.final[j]&&!state.final[j].correct?q[4]:null).filter(Boolean);
$('#main').innerHTML='<div class="eyebrow">FINAL CHALLENGE / 總結挑戰</div><h1>🏁 把歷史讀成有關係的故事</h1><p class="lead">共6題，每題同權重；依本次第一次作答計分，完成後顯示百分制成績與複習建議。這是練習，不取代正式評量。</p><section class="score-panel"><small>本次成績</small><strong>'+(submitted?score:'—')+'<small>/ 100</small></strong><p>'+(submitted?'答對 '+correct+' / 6 題；完成 '+lessons.filter((_,i)=>completed(i)).length+' / 8 個學習單元。':'已作答 '+Object.keys(state.final).length+' / 6 題')+'</p>'+(submitted?'<div class="review">'+(mistakes.length?'建議回看：'+mistakes.join('、'):'你已掌握這次挑戰。試著用新情境再解釋一次！')+'</div>':'')+'</section><section class="panel">'+finals.map((q,j)=>{let a=state.final[j];return '<article class="question"><small class="kicker">第 '+(j+1)+' 題 · '+q[4]+'</small><p class="qtitle">'+q[0]+'</p><div class="options">'+q[1].map((x,k)=>'<button class="option '+(a&&a.pick===k?(a.correct?'right':'wrong'):'')+'" data-final="'+j+'" data-choice="'+k+'" '+(a?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+k)+'</span>'+x+'</button>').join('')+'</div><div role="status" aria-live="polite" class="feedback">'+(a?'<b>'+(a.correct?'✓ 正確':'↻ 本題未答對')+'</b> '+esc(q[3])+' 正確選項：'+String.fromCharCode(65+q[2])+'.':'選擇後即計入本次成績；本題不能改答。')+'</div></article>';}).join('')+'</section><div class="bottom-nav"><button class="quiet" id="backlearn">← 回到學習</button><button id="download" '+(submitted?'':'disabled')+'>下載我的學習紀錄</button><button class="quiet" id="restartfinal">重新挑戰（清除本次成績）</button></div><dialog id="retryDialog"><h2>開始新的挑戰？</h2><p>將清除本次六題作答與成績，單元進度與反思會保留。</p><form method="dialog"><button value="cancel" class="quiet">保留本次</button><button value="ok">開始新挑戰</button></form></dialog>';
document.querySelectorAll('[data-final]').forEach(b=>b.onclick=()=>{let j=+b.dataset.final;if(state.final[j])return;state.final[j]={pick:+b.dataset.choice,correct:+b.dataset.choice===finals[j][2]};let pos=window.scrollY;save();renderFinal();window.scrollTo(0,pos);});
$('#backlearn').onclick=()=>go(0);$('#restartfinal').onclick=()=>$('#retryDialog').showModal();$('#retryDialog').onclose=()=>{if($('#retryDialog').returnValue==='ok'){state.final={};save();renderFinal();}};$('#download').onclick=download;
}
function download(){let correct=Object.values(state.final).filter(a=>a.correct).length;let out=['宋元到明清｜學生自學紀錄','總結挑戰：'+Math.round(correct/6*100)+' / 100（'+correct+'/6題）','此為目前瀏覽器的練習紀錄，不是正式成績。',''];lessons.forEach((l,i)=>{out.push((i+1)+'. '+l.title+'：'+(completed(i)?'完成':'尚未全部完成'));out.push('我的反思：'+(state.notes[i]||'尚未填寫'));});out.push('','總結題目');finals.forEach((q,i)=>out.push((i+1)+'. '+q[0]+'｜'+(state.final[i]?.correct?'正確':'未答對')+'｜'+q[3]));let url=URL.createObjectURL(new Blob([out.join('\n')],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='宋元明清_我的學習紀錄.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
render();
</script></body></html>
